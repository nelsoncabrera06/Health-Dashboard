name: Refresh demo data

# Mantiene actualizados los datos del usuario demo.
# El script no regenera contenido: desplaza las fechas existentes (meals,
# workouts, weights) para que el último registro caiga en el DÍA ANTERIOR a la
# corrida. El día de hoy queda a propósito vacío (criterio de Nelson, 20-nov):
# la demo busca que el visitante entre y pruebe el chat registrando una comida
# de hoy, no mostrarle un día ya cargado.
#
# Cada 2 días a las 04:00 UTC (01:00 en Argentina; bien temprano porque los
# cron de Actions se atrasan). Hasta 2 días de desfasaje entre corridas.
on:
  schedule:
    - cron: "0 4 */2 * *"
  workflow_dispatch: # permite dispararlo a mano desde la pestaña Actions

# Si una corrida se solapa con otra, se encolan en vez de pisarse.
concurrency:
  group: refresh-demo
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Desplazar los datos del demo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
        run: python3 scripts/refresh_demo.py
